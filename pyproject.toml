[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pausio"
version = "0.1.0"
description = "Local-first, reviewable editing plans for natural talking-head videos"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Daniele Moltisanti"}]
keywords = ["video", "editing", "ffmpeg", "shorts", "local-first"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Topic :: Multimedia :: Video",
]

[project.scripts]
pausio = "pausio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
