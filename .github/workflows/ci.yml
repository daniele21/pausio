name: CI
on:
  push:
    branches: [main, "daniele/**", "feature/**"]
  pull_request:
    branches: [main, "daniele/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pausio-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Pausio
        run: python -m pip install -e .
      - name: Validate Agent Skills
        run: python scripts/validate_skills.py
      - name: Validate public workflow security policy
        run: python scripts/check_security_workflows.py
      - name: Compile all modules
        run: python -m compileall -q src scripts
      - name: Run tests including media and skill validation
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: pausio doctor
